
# --- Users & directories ---
- name: Ensure app group exists
  group:
    name: "{{ app_group }}"
    state: present

- name: Ensure app user exists
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ project_root }}"
    shell: /usr/sbin/nologin
    create_home: yes
    system: yes

- name: Add nginx user to app group (for socket access)
  user:
    name: "{{ web_group }}"
    groups: "{{ app_group }}"
    append: yes

- name: Create project directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0770"
  loop:
    - "{{ project_root }}"
    - "{{ project_root }}/logs"

# --- Backend ---

- name: Synchronize backend code
  synchronize:
    src: "{{ backend_src }}/"
    dest: "{{ backend_dest }}/"
    delete: yes
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=__pycache__"

- name: Fix permissions on backend
  file:
    path: "{{ backend_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
    recurse: yes

- name: Create Python venv
  command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"
  become: yes
  become_user: "{{ app_user }}"

- name: Install backend requirements
  pip:
    requirements: "{{ backend_dest }}/requirements.txt"
    virtualenv: "{{ venv_dir }}"
  become: yes
  become_user: "{{ app_user }}"

- name: Collect static (Django)
  command: "{{ venv_dir }}/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ backend_dest }}"
  become: yes
  become_user: "{{ app_user }}"  
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"

- name: Run migrations (Django)
  command: "{{ venv_dir }}/bin/python manage.py migrate --noinput"
  become: yes
  become_user: "{{ app_user }}"
  args:
    chdir: "{{ backend_dest }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"

- name: Synchronize frontend code
  synchronize:
    src: "{{ frontend_src }}/"
    dest: "{{ frontend_dest }}/"
    delete: yes
    rsync_opts:
      - "--exclude=node_modules"

- name: Fix permissions on frontend
  file:
    path: "{{ frontend_dest }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
    recurse: yes

- name: Install frontend dependencies
  npm:
    path: "{{ frontend_dest }}"
    production: false

- name: Build frontend
  command: "{{ frontend_build_cmd }}"
  args:
    chdir: "{{ frontend_dest }}"

# --- Services ---
- name: Install systemd service (gunicorn)
  template:
    src: gunicorn.service.j2
    dest: "/etc/systemd/system/{{ service_name }}.service"
  notify:
    - daemon-reload
    - restart app

- name: Nginx site
  template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ service_name }}"
  notify: reload nginx

- name: Enable nginx site
  file:
    src: "/etc/nginx/sites-available/{{ service_name }}"
    dest: "/etc/nginx/sites-enabled/{{ service_name }}"
    state: link
    force: yes
  notify: reload nginx

- name: Disable default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure nginx enabled
  systemd:
    name: nginx
    enabled: yes
