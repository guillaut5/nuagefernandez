- name: daemon-reload
  systemd:
    daemon_reload: yes

- name: restart app
  systemd:
    name: "{{ service_name }}"
    state: restarted
    enabled: yes

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded


- name: restart nginx
  systemd:
    name: nginx
    state: restarted
    enabled: yes

    
- name: restart speaker
  systemd:
    name: speaker
    state: restarted
    enabled: yes